openapi: 3.0.3
info:
  title: BrewLite API
  version: 1.0.0
  description: >-
    Contract baseline issue #1, cập nhật mô tả trạng thái 26/10/2026. Các route nghiệp vụ và JWT đã tích hợp
    với PostgreSQL; gateway Ví/Thẻ là mock theo MVP. Protected routes thiếu hoặc sai JWT trả 401.
    Các response 501 giữ để tham chiếu skeleton cũ, không phải hành vi nghiệm thu runtime hiện tại.
servers:
  - url: http://localhost:3001/api
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Products
  - name: Auth
  - name: Orders
  - name: Payments
  - name: Promotions
  - name: Loyalty
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Liveness hiện có
      description: ''
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                liveness:
                  value:
                    status: ok
                    service: brewlite-api
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: Readiness PostgreSQL hiện có
      description: ''
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              examples:
                readiness:
                  value:
                    status: ok
                    database: connected
        '503':
          description: Legacy NestJS error, giữ đúng runtime hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyHealthError'
              examples:
                database unavailable:
                  value:
                    statusCode: 503
                    message: Database unavailable
                    error: Service Unavailable
      security: []
  /products:
    get:
      operationId: listProducts
      tags:
        - Products
      summary: Danh sách sản phẩm active
      description: >-
        Sắp xếp createdAt ASC, id ASC. Chỉ active; vẫn trả sản phẩm stock=0 để UI hiện hết hàng. page=1, limit=12 mặc
        định; totalPages=0 khi rỗng.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              examples:
                catalog:
                  value:
                    data:
                      - id: 11111111-1111-4111-8111-111111111111
                        name: Cappuccino
                        description: Cà phê espresso và sữa
                        price: 45000
                        imageUrl: http://localhost:3000/images/cappuccino.jpg
                        stock: 20
                    meta:
                      page: 1
                      limit: 12
                      total: 1
                      totalPages: 1
                empty catalog:
                  value:
                    data: []
                    meta:
                      page: 1
                      limit: 12
                      total: 0
                      totalPages: 0
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
  /products/{id}:
    get:
      operationId: getProduct
      tags:
        - Products
      summary: Chi tiết size và topping active
      description: >-
        Sản phẩm inactive trả 404 PRODUCT_NOT_FOUND. size S/M/L không trùng; giá S bằng price. Topping chỉ gồm loại
        active được phép trên sản phẩm.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              examples:
                detail:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    name: Cappuccino
                    description: Cà phê espresso và sữa
                    price: 45000
                    imageUrl: http://localhost:3000/images/cappuccino.jpg
                    stock: 20
                    sizes:
                      - size: S
                        price: 45000
                        stock: 20
                      - size: M
                        price: 50000
                        stock: 16
                      - size: L
                        price: 55000
                        stock: 13
                    toppings:
                      - id: 22222222-2222-4222-8222-222222222222
                        name: Kem
                        price: 10000
                        stock: 33
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại hoặc không thuộc chủ đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing product:
                  value:
                    statusCode: 404
                    code: PRODUCT_NOT_FOUND
                    message: Không tìm thấy sản phẩm
                    details: []
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
  /auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Đăng ký CUSTOMER
      description: Email trim/lowercase và unique; bcrypt cost 12; không cho đăng ký STAFF. 409 EMAIL_ALREADY_EXISTS.
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                register:
                  value:
                    accessToken: <JWT-issued-by-backend>
                    tokenType: Bearer
                    expiresIn: 3600
                    user:
                      id: 33333333-3333-4333-8333-333333333333
                      email: customer@example.com
                      role: CUSTOMER
                      loyaltyPoints: 0
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/version/tồn kho/key/lượt ưu đãi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicate email:
                  value:
                    statusCode: 409
                    code: EMAIL_ALREADY_EXISTS
                    message: Email đã được sử dụng
                    details: []
          headers:
            Retry-After:
              description: 1 khi code=IDEMPOTENCY_IN_PROGRESS, đơn vị giây.
              schema:
                type: integer
                minimum: 1
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              email: customer@example.com
              password: DemoPass123!
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Đăng nhập và cấp JWT 60 phút
      description: Email trim/lowercase. 401 INVALID_CREDENTIALS cho email/password sai; không lộ email có tồn tại hay không.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                login:
                  value:
                    accessToken: <JWT-issued-by-backend>
                    tokenType: Bearer
                    expiresIn: 3600
                    user:
                      id: 33333333-3333-4333-8333-333333333333
                      email: customer@example.com
                      role: CUSTOMER
                      loyaltyPoints: 0
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu/sai/hết hạn xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid credentials:
                  value:
                    statusCode: 401
                    code: INVALID_CREDENTIALS
                    message: Email hoặc mật khẩu không đúng
                    details: []
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: customer@example.com
              password: DemoPass123!
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: User từ JWT đã xác minh
      description: ''
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                current user:
                  value:
                    id: 33333333-3333-4333-8333-333333333333
                    email: customer@example.com
                    role: CUSTOMER
                    loyaltyPoints: 0
        '401':
          description: Thiếu/sai/hết hạn xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/quote:
    post:
      operationId: quoteOrder
      tags:
        - Orders
      summary: Tính lại giá trước checkout, không giữ tài nguyên
      description: >-
        Canonical cart, kiểm tra stock hiện tại/option/mã và giá. Không tạo đơn hoặc tiêu lượt mã. Khi tạo đơn kiểm tra
        lại; quote không giữ hàng/lượt. 409 OUT_OF_STOCK/PROMOTION_EXHAUSTED.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              examples:
                quote:
                  value:
                    items:
                      - productId: 11111111-1111-4111-8111-111111111111
                        productName: Cappuccino
                        size: M
                        sizePrice: 50000
                        toppings:
                          - id: 22222222-2222-4222-8222-222222222222
                            name: Kem
                            price: 10000
                        qty: 2
                        unitPrice: 60000
                        lineTotal: 120000
                    subtotal: 120000
                    discount: 12000
                    total: 108000
                    currency: VND
                    promotionCode: SAVE10
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu/sai/hết hạn xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/version/tồn kho/key/lượt ưu đãi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: 1 khi code=IDEMPOTENCY_IN_PROGRESS, đơn vị giây.
              schema:
                type: integer
                minimum: 1
        '422':
          description: Lựa chọn hoặc mã khuyến mãi không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              items:
                - productId: 11111111-1111-4111-8111-111111111111
                  size: M
                  toppingIds:
                    - 22222222-2222-4222-8222-222222222222
                  qty: 2
              promotionCode: SAVE10
  /orders:
    post:
      operationId: createOrder
      tags:
        - Orders
      summary: Tạo đơn PENDING và giữ kho/lượt ưu đãi đúng một lần
      description: >-
        Bắt buộc Idempotency-Key UUID. Chuẩn hóa cart và hash payload; cùng key/payload replay 201 cùng body, key khác
        payload 409. Transaction order+snapshot+stock optimistic locking+promo+key. Không tự tạo payment. User xác nhận
        tổng cuối trước payment.
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                create pending:
                  value:
                    id: 44444444-4444-4444-8444-444444444444
                    code: BL-20261022-A1B2C3D4
                    status: PENDING
                    reservationStatus: HELD
                    version: 0
                    subtotal: 120000
                    discount: 12000
                    total: 108000
                    currency: VND
                    promotionCode: SAVE10
                    createdAt: '2026-10-22T12:00:00Z'
                    updatedAt: '2026-10-22T12:00:00Z'
                    items:
                      - productId: 11111111-1111-4111-8111-111111111111
                        productName: Cappuccino
                        size: M
                        sizePrice: 50000
                        toppings:
                          - id: 22222222-2222-4222-8222-222222222222
                            name: Kem
                            price: 10000
                        qty: 2
                        unitPrice: 60000
                        lineTotal: 120000
                        id: 55555555-5555-4555-8555-555555555555
                replay same order:
                  value:
                    id: 44444444-4444-4444-8444-444444444444
                    code: BL-20261022-A1B2C3D4
                    status: PENDING
                    reservationStatus: HELD
                    version: 0
                    subtotal: 120000
                    discount: 12000
                    total: 108000
                    currency: VND
                    promotionCode: SAVE10
                    createdAt: '2026-10-22T12:00:00Z'
                    updatedAt: '2026-10-22T12:00:00Z'
                    items:
                      - productId: 11111111-1111-4111-8111-111111111111
                        productName: Cappuccino
                        size: M
                        sizePrice: 50000
                        toppings:
                          - id: 22222222-2222-4222-8222-222222222222
                            name: Kem
                            price: 10000
                        qty: 2
                        unitPrice: 60000
                        lineTotal: 120000
                        id: 55555555-5555-4555-8555-555555555555
          headers:
            Idempotency-Replayed:
              description: true khi replay, false ở lần thực hiện đầu.
              schema:
                type: boolean
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation error:
                  value:
                    statusCode: 400
                    code: VALIDATION_ERROR
                    message: Dữ liệu không hợp lệ
                    details:
                      - field: items.0.qty
                        message: qty phải là số nguyên từ 1 đến 99
        '401':
          description: Thiếu/sai/hết hạn xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthenticated:
                  value:
                    statusCode: 401
                    code: UNAUTHORIZED
                    message: Cần đăng nhập
                    details: []
        '409':
          description: Xung đột trạng thái/version/tồn kho/key/lượt ưu đãi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                stock exhausted:
                  value:
                    statusCode: 409
                    code: OUT_OF_STOCK
                    message: Sản phẩm không đủ tồn kho
                    details: []
          headers:
            Retry-After:
              description: 1 khi code=IDEMPOTENCY_IN_PROGRESS, đơn vị giây.
              schema:
                type: integer
                minimum: 1
        '422':
          description: Lựa chọn hoặc mã khuyến mãi không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              items:
                - productId: 11111111-1111-4111-8111-111111111111
                  size: M
                  toppingIds:
                    - 22222222-2222-4222-8222-222222222222
                  qty: 2
              promotionCode: SAVE10
  /orders/me:
    get:
      operationId: listMyOrders
      tags:
        - Orders
      summary: Lịch sử đơn của user hiện tại
      description: createdAt DESC, id DESC; page=1, limit=12 mặc định. Định nghĩa route tĩnh /me và /quote trước /:id trong NestJS.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                my history:
                  value:
                    data:
                      - id: 44444444-4444-4444-8444-444444444444
                        code: BL-20261022-A1B2C3D4
                        status: PAID
                        reservationStatus: CONSUMED
                        version: 1
                        subtotal: 120000
                        discount: 12000
                        total: 108000
                        currency: VND
                        promotionCode: SAVE10
                        createdAt: '2026-10-22T12:00:00Z'
                        updatedAt: '2026-10-22T12:00:00Z'
                    meta:
                      page: 1
                      limit: 12
                      total: 1
                      totalPages: 1
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu/sai/hết hạn xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Tạm thời trong giai đoạn skeleton: dịch vụ hoặc IdentityPort chưa triển khai. Không phải success hay kết quả
            nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
  /orders/{id}:
    get:
      operationId: getMyOrder
      tags:
        - Orders
      summary: Chi tiết snapshot đơn của mình
      description: Đơn của người khác và đơn không tồn tại đều 404 ORDER_NOT_FOUND. Nguồn trạng thái hiện tại sau retry/replay.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                my order:
                  value:
                    id: 44444444-4444-4444-8444-444444444444
                    code: BL-20261022-A1B2C3D4
                    status: PAID
                    reservationStatus: CONSUMED
                    version: 1
                    subtotal: 120000
                    discount: 12000
                    total: 108000
                    currency: VND
                    promotionCode: SAVE10
                    createdAt: '2026-10-22T12:00:00Z'
                    updatedAt: '2026-10-22T12:00:00Z'
                    items:
                      - productId: 11111111-1111-4111-8111-111111111111
                        productName: Cappuccino
                        size: M
                        sizePrice: 50000
                        toppings:
                          - id: 22222222-2222-4222-8222-222222222222
                            name: Kem
                            price: 10000
                        qty: 2
                        unitPrice: 60000
                        lineTotal: 120000
                        id: 55555555-5555-4555-8555-555555555555
        '400':
          description: Dữ liệu/header không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu/sai/hết hạn xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại hoặc không thuộc chủ đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                other users order:
                  value:
                    statusCode: 404
                    code: ORDER_NOT_FOUND
                    message: Không tìm thấy đơn hàng
                    details: []
        '500':
          description: Lỗi nội bộ, không lộ chi tiết DB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
