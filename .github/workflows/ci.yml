name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev
          POSTGRES_DB: brewlite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite_dev@localhost:5432/brewlite?schema=public
      RUN_DB_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm run docs:check
      - run: npm run api:check
      - run: npm --prefix backend ci
      - run: npm run docs:schema
      - run: npm --prefix frontend ci
      - run: npm run db:generate
      - run: npm --prefix backend run prisma:validate
      - run: npm --prefix backend run prisma:deploy
      - run: npm run lint
      - run: npm test
      - run: npm --prefix frontend test
      - run: npm run build
      - name: Smoke test API and database
        shell: bash
        run: |
          npm --prefix backend start > backend.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1
